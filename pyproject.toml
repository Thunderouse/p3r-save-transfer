[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p3r-save-transfer"
version = "1.0.0"
description = "Convert Persona 3 Reload saves from Xbox / Microsoft Store to the Steam version. Windows portable app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["persona3", "persona-3-reload", "savegame", "gvas", "steam", "xbox"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
p3r-save-transfer = "p3r_transfer.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "tests", "."]

[tool.coverage.run]
branch = true
source = ["p3r_transfer"]

[tool.coverage.report]
show_missing = true
